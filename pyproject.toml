[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsim"
version = "3.0.0"
description = "Event-driven and vectorized daily-bar backtesting with walk-forward testing and a deflated Sharpe check."
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["quantitative finance", "backtesting", "algorithmic trading", "options"]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "yfinance>=0.2.40",
    "fredapi>=0.5.1",
    "pandas-market-calendars>=4.3.0",
    "py_vollib>=1.0.1",
    "sqlalchemy>=2.0.0",
    "arch>=6.2.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
    "pytz>=2023.3",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.0.0", "scikit-learn>=1.3.0"]
optimization = ["cvxpy>=1.4.0", "scikit-learn>=1.3.0"]
trading = ["alpaca-py>=0.20.0"]
dashboard = ["streamlit>=1.32.0", "plotly>=5.18.0"]
fast = ["numba>=0.57.0"]
all = [
    "lightgbm>=4.0.0",
    "scikit-learn>=1.3.0",
    "cvxpy>=1.4.0",
    "alpaca-py>=0.20.0",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
    "numba>=0.57.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.0",
    "jsonschema>=4.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "playwright>=1.45",
]

[project.scripts]
quantsim = "quantsim.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: requires live data/API",
    "slow: takes > 5 seconds",
    "gpu: requires GPU",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning:pandas",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
files = ["src/quantsim/core", "src/quantsim/backtesting", "src/quantsim/reporting"]
ignore_missing_imports = true
follow_imports = "silent"
